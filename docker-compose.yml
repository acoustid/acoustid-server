services:
  nats:
    image: nats:2.10
    command:
      - "-js"

  nats-box:
    image: natsio/nats-box:0.17.0
    depends_on:
      - nats

  redis:
    image: redis

  postgres:
    image: ghcr.io/acoustid/postgres:pg18.4-main-688e2ac
    command:
      - "-c"
      - "wal_level=logical"
    volumes:
      - ./admin/ci/create_db.sql:/docker-entrypoint-initdb.d/10_create_db.sql
    environment:
      POSTGRES_USER: acoustid
      POSTGRES_PASSWORD: acoustid
      POSTGRES_DB: postgres

  index:
    image: ghcr.io/acoustid/acoustid-index:v2022.02.03

  # Catches outgoing mail in development and tests. The web UI and API are on
  # port 8025. Any SMTP login is accepted, without TLS.
  mailpit:
    image: axllent/mailpit:v1.33.1
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  init-db:
    image: quay.io/acoustid/acoustid-server:latest
    build: .
    depends_on:
      - postgres
    command:
      - bash
      - -ecx
      - |
        /opt/acoustid/server/admin/docker/run-alembic.sh upgrade head
    env_file:
      - ./admin/dev/server.env
    profiles:
      - tools

  api:
    image: quay.io/acoustid/acoustid-server:latest
    build: .
    depends_on:
      - redis
      - postgres
      - index
      - mailpit
    command:
      - /opt/acoustid/server/admin/docker/run-api.sh
    env_file:
      - ./admin/dev/server.env
    profiles:
      - frontend

  web:
    image: quay.io/acoustid/acoustid-server:latest
    build: .
    depends_on:
      - redis
      - postgres
      - index
      - mailpit
    command:
      - /opt/acoustid/server/admin/docker/run-web.sh
    env_file:
      - ./admin/dev/server.env
    profiles:
      - frontend

  cron:
    image: quay.io/acoustid/acoustid-server:latest
    build: .
    depends_on:
      - redis
      - postgres
      - index
      - mailpit
    command:
      - /opt/acoustid/server/admin/docker/run-cron.sh
    env_file:
      - ./admin/dev/server.env
    profiles:
      - backend

  worker:
    image: quay.io/acoustid/acoustid-server:latest
    build: .
    depends_on:
      - redis
      - postgres
      - index
      - mailpit
    command:
      - /opt/acoustid/server/admin/docker/run-worker.sh
    env_file:
      - ./admin/dev/server.env
    profiles:
      - backend
