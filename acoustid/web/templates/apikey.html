{% extends "_base.html" %}
{% block content %}

<div class="page-head">
  <h1>{{ title }}</h1>
</div>

<p>
  Your API key is a token that can be used in an application for submitting
  new fingerprints to the AcoustID database.
</p>

<p>
  Your current API key:
</p>

<p>
	<span class="id-chip apikey"><span>{{ apikey }}</span><button type="button" data-copy="{{ apikey }}">Copy</button></span>
</p>

<p>
	<a class="btn" href="{{ url_for('user.new_api_key') }}">Generate a new API key</a>
</p>

{% endblock %}
